name: Publish Dev Container

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/publish-devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/unofficial-wpilib-devcontainer" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ steps.image.outputs.name }}
          cacheFrom: ${{ steps.image.outputs.name }}
          imageTag: latest,${{ github.sha }}
          push: always
